<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smarf README Banner</title>
<link rel="stylesheet" href="https://use.typekit.net/qbq1ozm.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800;900&display=swap">
<!--
  The README's banner: 1280×640 (GitHub's social preview size too). Open with ?render to show the canvas alone,
  then screenshot it at 2x from headless Chrome into readme-thumb.png. Serve over localhost: the font kit doesn't
  serve other hosts.
-->
<style>
  :root {
    --z50: #fafafa; --z200: #e4e4e7; --z300: #d4d4d8; --z400: #9f9fa9; --z500: #71717b; --z600: #52525c; --z700: #3f3f46; --z800: #27272a; --z900: #18181b; --z950: #09090b;
    --green: #00c950;
    --p100: oklch(93% 0.034 272.788); --p200: oklch(87% 0.065 274.039); --p300: oklch(78.5% 0.115 274.713); --p400: oklch(67.3% 0.182 276.935); --p500: oklch(58.5% 0.233 277.117); --p600: oklch(51.1% 0.262 276.966); --p700: oklch(45.7% 0.24 277.023); --p950: oklch(25.7% 0.09 281.288);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e7e5e4; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .stage { width: min(1280px, 100%); aspect-ratio: 2 / 1; position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px -24px rgba(0,0,0,.5); }

  .banner {
    position: absolute; left: 0; top: 0; width: 1280px; height: 640px; overflow: hidden; transform-origin: 0 0; transform: scale(var(--s, 1));
    background: var(--z950); color: var(--z50);
    font-family: 'Interstate', 'Overpass', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.4;
  }
  .banner * { box-sizing: border-box; }
  .banner img, .banner svg { display: block; }

  /* The sign-in page's hero wall (hero-backdrop.tsx): columns of portraits, tilted -12deg, each one offset */
  .wall { position: absolute; left: 50%; top: 50%; display: flex; gap: 12px; transform: translate(-50%, -50%) rotate(-12deg); }
  .wall .col { display: flex; flex-direction: column; gap: 12px; }
  .wall img { width: 128px; height: 72px; border-radius: 4px; object-fit: cover; opacity: .5; }
  /* Darken the wall: solid behind the copy, clearing towards the top right, deep at the bottom */
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, var(--z950) 0%, rgba(9,9,11,.94) 34%, rgba(9,9,11,.55) 62%, rgba(9,9,11,.75) 100%),
    linear-gradient(0deg, rgba(9,9,11,.9) 0%, transparent 45%); }
  /* Indigo light from behind the board, and a faint one behind the heading */
  .glow { position: absolute; inset: 0; pointer-events: none; background:
    radial-gradient(520px 380px at 74% 52%, color-mix(in oklab, var(--p600) 38%, transparent), transparent 70%),
    radial-gradient(520px 340px at 8% 30%, color-mix(in oklab, var(--p700) 22%, transparent), transparent 70%); }
  /* A hairline of light along the top edge */
  .rim { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--p300) 70%, transparent) 50%, transparent); }

  /* Copy */
  .copy { position: absolute; left: 80px; top: 76px; bottom: 76px; width: 500px; display: flex; flex-direction: column; z-index: 3; }
  .lk { display: flex; align-items: center; gap: 14px; }
  .lk .bd { width: 48px; height: 48px; filter: drop-shadow(0 0 22px oklch(58.5% 0.233 277.117 / .75)); }
  .lk .wd { font-size: 30px; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; line-height: 1; padding-top: 4px; }
  h1 { margin: auto 0 0; font-size: 60px; font-weight: 800; letter-spacing: -.025em; line-height: 1.04; }
  h1 span { display: block; white-space: nowrap; }
  .metal-text { background-image: linear-gradient(180deg, var(--p100) 0%, var(--p300) 45%, var(--p400) 58%, var(--p200) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 22px 0 auto; font-size: 20px; line-height: 1.5; color: var(--z400); max-width: 440px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--z300);
    background: rgba(39,39,42,.6); border: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 1px 1px rgba(255,255,255,.04); }
  .pill svg { color: var(--p300); }

  /* The board: category cards on the dot grid, in a window, tipped back a little */
  .scene { position: absolute; left: 604px; top: 58px; width: 700px; height: 540px; perspective: 1600px; z-index: 2; }
  .board { position: absolute; inset: 0; border-radius: 20px; transform: rotateY(-9deg) rotateX(5deg) rotateZ(1deg); transform-origin: 0 50%;
    background-color: var(--z900);
    background-image: radial-gradient(circle, var(--z600) 1.5px, transparent 1.5px), radial-gradient(circle, color-mix(in oklab, var(--z800), var(--z700) 45%) 1px, transparent 1px);
    background-size: 64px 64px, 16px 16px; background-position: -32px 16px, -8px -8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 0 0 1px rgba(0,0,0,.6), 0 50px 100px -20px rgba(0,0,0,.9), 0 0 140px -10px color-mix(in oklab, var(--p500) 45%, transparent); }
  .board::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.05), transparent 40%); }

  .cat { position: absolute; border-radius: 12px; background: rgba(39,39,42,.82); isolation: isolate;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 0 0 1px rgba(0,0,0,.5), 0 10px 15px -3px rgba(0,0,0,.35), 0 4px 6px -4px rgba(0,0,0,.35); }
  .cat::before { content: ""; position: absolute; left: 1px; right: 1px; top: 1px; height: 47px; z-index: -1; border-radius: 11px 11px 0 0;
    background-image: linear-gradient(to right, color-mix(in oklab, var(--cc, transparent) 35%, transparent), color-mix(in oklab, var(--cc, transparent) 10%, transparent) 45%, transparent 80%); }
  .cat-h { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; }
  .cat-h .grip { color: rgba(255,255,255,.3); }
  .cat-h .nm { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .tray { display: flex; flex-wrap: wrap; padding: 3px; border-radius: 8px 8px 12px 12px; border: 1px solid rgba(255,255,255,.08); background: var(--z900); }
  .hero { flex: none; width: 88px; padding: 4px; }
  .hero img, .hero .ph { width: 80px; height: 45px; border-radius: 4px; object-fit: cover; background: var(--z700); }
  .hero.slot .ph { background: color-mix(in oklab, var(--p500) 14%, transparent); border: 2px dashed color-mix(in oklab, var(--p400) 80%, transparent); }
  .cat.over { box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 0 2px var(--p400), 0 10px 15px -3px rgba(0,0,0,.35), 0 0 40px -6px color-mix(in oklab, var(--p500) 60%, transparent); }

  /* The hero in hand, lifted above the board, with the cursor on it */
  .lift { position: absolute; z-index: 5; transform: rotate(-6deg) scale(1.12); }
  .lift img { width: 80px; height: 45px; border-radius: 4px; object-fit: cover;
    box-shadow: 0 0 0 2px var(--p300), 0 18px 30px -6px rgba(0,0,0,.8), 0 0 30px -4px color-mix(in oklab, var(--p500) 80%, transparent); }
  .lift svg { position: absolute; left: 56px; top: 30px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }

  /* Dock (board-toolbar.tsx) + New category (metal-button.tsx) */
  .dock-wrap { position: absolute; left: 32px; bottom: 26px; display: flex; align-items: flex-end; gap: 8px; }
  .glass { border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(39,39,42,.7);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.05); }
  .dock-row { height: 44px; display: flex; align-items: center; padding: 0 4px; white-space: nowrap; }
  .switcher { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; font-weight: 600; }
  .switcher .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .switcher svg { color: var(--z500); margin-left: 4px; }
  .ibtns { display: flex; gap: 2px; margin-left: 2px; }
  .ibtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--z400); }
  .ibtn.on { color: #fdc700; }
  .metal { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px 0 16px; border-radius: 12px; font-weight: 700; color: #fff; white-space: nowrap;
    border: 1px solid color-mix(in oklab, var(--p200) 40%, transparent);
    background-image: linear-gradient(180deg, var(--p300) 0%, var(--p400) 42%, var(--p500) 58%, var(--p400) 100%);
    box-shadow: 0 10px 15px -3px color-mix(in oklab, var(--p500) 45%, transparent), inset 0 1px 2px rgba(255,255,255,.5);
    text-shadow: 0 1px 1px color-mix(in oklab, var(--p950) 50%, transparent); }
</style>
</head>
<body>
<div class="stage">
  <div class="banner">
    <div class="wall" data-wall></div>
    <div class="shade"></div>
    <div class="glow"></div>
    <div class="rim"></div>

    <div class="copy">
      <div class="lk"><img class="bd" src="og-assets/badge.svg" alt=""><span class="wd">Smarf</span></div>
      <h1><span>Your Dota 2</span><span><span class="metal-text" style="display:inline">hero grid,</span></span><span>in the browser</span></h1>
      <p class="sub">Drag heroes into categories you can move and resize. Make tier lists, hero pools and ban/picks, then share them with a link.</p>
      <div class="pills" data-pills></div>
    </div>

    <div class="scene"><div class="board">
      <div class="cat" style="left:32px;top:32px;--cc:#fb2c36" data-n="Mid Farming" data-h="invoker obsidian_destroyer ember_spirit storm_spirit"></div>
      <div class="cat" style="left:400px;top:32px;--cc:#8e51ff" data-n="Strong Lane" data-h="viper razor"></div>
      <div class="cat" style="left:32px;top:141px;--cc:#00bc7d" data-n="Roaming" data-h="spirit_breaker earth_spirit tusk nyx_assassin mirana hoodwink snapfire" data-w="624"></div>
      <div class="cat over" style="left:32px;top:250px;--cc:#fe9a00" data-n="Gangster Duo" data-h="wisp gyrocopter _slot"></div>
      <div class="cat" style="left:320px;top:250px;--cc:#2b7fff" data-n="Save Meta" data-h="oracle dazzle abaddon winter_wyvern"></div>
      <div class="cat" style="left:32px;top:359px;--cc:#f6339a" data-n="Feeling Lucky" data-h="pudge techies meepo rubick chen"></div>
      <div class="lift" style="left:226px;top:262px"><img data-hero="lina" alt=""><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.4 2.9 6.6 2.9-1.3-2.9-6.5H19L5 2.5Z" fill="#fff" stroke="#09090b" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
      <div class="dock-wrap">
        <div class="glass"><div class="dock-row">
          <div class="switcher"><span class="dot"></span><span>Main v7.41</span><i data-icon="chevrons"></i></div>
          <div class="ibtns"><span class="ibtn on" data-icon="star"></span><span class="ibtn" data-icon="pencil"></span><span class="ibtn" data-icon="link"></span><span class="ibtn" data-icon="dots"></span></div>
        </div></div>
        <div class="metal"><i data-icon="folder"></i>New category</div>
      </div>
    </div></div>
  </div>
</div>

<script>
const CDN = (n) => `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${n}.png`;
const SVG = (d, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 20 20" fill="currentColor">${d}</svg>`;
const ICON = {
  grip: SVG('<path fill-rule="evenodd" d="M2 6.75A.75.75 0 0 1 2.75 6h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 6.75Zm0 6.5a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1-.75-.75Z"/>'),
  chevrons: SVG('<path fill-rule="evenodd" d="M10.53 3.47a.75.75 0 0 0-1.06 0L6.22 6.72a.75.75 0 0 0 1.06 1.06L10 5.06l2.72 2.72a.75.75 0 1 0 1.06-1.06l-3.25-3.25Zm-4.31 9.81 3.25 3.25a.75.75 0 0 0 1.06 0l3.25-3.25a.75.75 0 1 0-1.06-1.06L10 14.94l-2.72-2.72a.75.75 0 0 0-1.06 1.06Z"/>', 16),
  star: SVG('<path fill-rule="evenodd" d="M10.868 2.884c-.321-.772-1.415-.772-1.736 0l-1.83 4.401-4.753.381c-.833.067-1.171 1.107-.536 1.651l3.62 3.102-1.106 4.637c-.194.813.691 1.456 1.405 1.02L10 15.591l4.069 2.485c.713.436 1.598-.207 1.404-1.02l-1.106-4.637 3.62-3.102c.635-.544.297-1.584-.536-1.65l-4.752-.382-1.831-4.401Z"/>', 16),
  pencil: SVG('<path d="m5.433 13.917 1.262-3.155A4 4 0 0 1 7.58 9.42l6.92-6.918a2.121 2.121 0 0 1 3 3l-6.92 6.918c-.383.383-.84.685-1.343.886l-3.154 1.262a.5.5 0 0 1-.65-.65Z"/><path d="M3.5 5.75c0-.69.56-1.25 1.25-1.25H10A.75.75 0 0 0 10 3H4.75A2.75 2.75 0 0 0 2 5.75v9.5A2.75 2.75 0 0 0 4.75 18h9.5A2.75 2.75 0 0 0 17 15.25V10a.75.75 0 0 0-1.5 0v5.25c0 .69-.56 1.25-1.25 1.25h-9.5c-.69 0-1.25-.56-1.25-1.25v-9.5Z"/>', 16),
  link: SVG('<path d="M12.232 4.232a2.5 2.5 0 0 1 3.536 3.536l-1.225 1.224a.75.75 0 0 0 1.061 1.06l1.224-1.224a4 4 0 0 0-5.656-5.656l-3 3a4 4 0 0 0 .225 5.865.75.75 0 0 0 .977-1.138 2.5 2.5 0 0 1-.142-3.667l3-3Z"/><path d="M11.603 7.963a.75.75 0 0 0-.977 1.138 2.5 2.5 0 0 1 .142 3.667l-3 3a2.5 2.5 0 0 1-3.536-3.536l1.225-1.224a.75.75 0 0 0-1.061-1.06l-1.224 1.224a4 4 0 1 0 5.656 5.656l3-3a4 4 0 0 0-.225-5.865Z"/>', 16),
  dots: SVG('<path d="M3 10a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM8.5 10a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM15.5 8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>', 16),
  folder: SVG('<path fill-rule="evenodd" d="M3.75 3A1.75 1.75 0 0 0 2 4.75v10.5c0 .966.784 1.75 1.75 1.75h12.5A1.75 1.75 0 0 0 18 15.25v-8.5A1.75 1.75 0 0 0 16.25 5h-4.836a.25.25 0 0 1-.177-.073L9.823 3.513A1.75 1.75 0 0 0 8.586 3H3.75ZM10 8a.75.75 0 0 1 .75.75v1.5h1.5a.75.75 0 0 1 0 1.5h-1.5v1.5a.75.75 0 0 1-1.5 0v-1.5h-1.5a.75.75 0 0 1 0-1.5h1.5v-1.5A.75.75 0 0 1 10 8Z"/>'),
  squares: SVG('<path fill-rule="evenodd" d="M4.25 2A2.25 2.25 0 0 0 2 4.25v2.5A2.25 2.25 0 0 0 4.25 9h2.5A2.25 2.25 0 0 0 9 6.75v-2.5A2.25 2.25 0 0 0 6.75 2h-2.5Zm0 9A2.25 2.25 0 0 0 2 13.25v2.5A2.25 2.25 0 0 0 4.25 18h2.5A2.25 2.25 0 0 0 9 15.75v-2.5A2.25 2.25 0 0 0 6.75 11h-2.5Zm9-9A2.25 2.25 0 0 0 11 4.25v2.5A2.25 2.25 0 0 0 13.25 9h2.5A2.25 2.25 0 0 0 18 6.75v-2.5A2.25 2.25 0 0 0 15.75 2h-2.5Zm0 9A2.25 2.25 0 0 0 11 13.25v2.5A2.25 2.25 0 0 0 13.25 18h2.5A2.25 2.25 0 0 0 18 15.75v-2.5A2.25 2.25 0 0 0 15.75 11h-2.5Z"/>', 16),
  share: SVG('<path d="M13 4.5a2.5 2.5 0 1 1 .702 1.737L6.97 9.604a2.518 2.518 0 0 1 0 .792l6.733 3.367a2.5 2.5 0 1 1-.671 1.341l-6.733-3.367a2.5 2.5 0 1 1 0-3.475l6.733-3.366A2.52 2.52 0 0 1 13 4.5Z"/>', 16),
  discord: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.1 14.1 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03ZM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>'
};
document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = el.tagName === 'I' ? ICON[el.dataset.icon] : `<span class="${el.className}">${ICON[el.dataset.icon]}</span>`; });
document.querySelectorAll('[data-hero]').forEach((el) => { el.src = CDN(el.dataset.hero); });

document.querySelectorAll('.cat').forEach((el) => {
  const list = el.dataset.h.split(' ');
  const width = el.dataset.w ? +el.dataset.w : list.length * 88 + 8;
  const tiles = list.map((n) => n === '_slot' ? '<div class="hero slot"><div class="ph"></div></div>' : `<div class="hero"><img src="${CDN(n)}" alt=""></div>`).join('');
  el.innerHTML = `<div class="cat-h"><span class="grip">${ICON.grip}</span><span class="nm">${el.dataset.n}</span></div><div class="tray" style="width:${width}px">${tiles}</div>`;
});

document.querySelector('[data-pills]').innerHTML = [
  [ICON.squares, 'Boards'], [ICON.share, 'Share links'], [ICON.discord, 'Discord sign-in']
].map(([i, t]) => `<span class="pill">${i}${t}</span>`).join('');

// The hero wall: 16 columns × 9, each column a different slice of the roster, nudged up or down
const WALL = ['antimage','axe','bane','bloodseeker','crystal_maiden','drow_ranger','earthshaker','juggernaut','mirana','morphling','nevermore','phantom_lancer','puck','pudge','razor','sand_king','storm_spirit','sven','tiny','vengefulspirit','windrunner','zuus','kunkka','lina','lion','shadow_shaman','slardar','tidehunter','witch_doctor','lich','riki','enigma','tinker','sniper','necrolyte','warlock','beastmaster','queenofpain','venomancer','faceless_void','skeleton_king','death_prophet','phantom_assassin','pugna','templar_assassin','viper','luna','dragon_knight','dazzle','rattletrap','leshrac','furion','life_stealer','dark_seer','clinkz','omniknight','enchantress','huskar','night_stalker','broodmother','bounty_hunter','weaver','jakiro','batrider','chen','spectre','ancient_apparition','doom_bringer','ursa','spirit_breaker','gyrocopter','alchemist','invoker','silencer','obsidian_destroyer','lycan','brewmaster','shadow_demon','lone_druid','chaos_knight','meepo','treant','ogre_magi','undying','rubick','disruptor','nyx_assassin','naga_siren','keeper_of_the_light','wisp','visage','slark','medusa','troll_warlord','centaur','magnataur','shredder','bristleback','tusk','skywrath_mage','abaddon','elder_titan','legion_commander','techies','ember_spirit','earth_spirit','abyssal_underlord','terrorblade','phoenix','oracle','winter_wyvern','arc_warden','monkey_king','dark_willow','pangolier','grimstroke','hoodwink','void_spirit','snapfire','mars','dawnbreaker','marci','primal_beast','muerta','ringmaster','kez'];
const wall = document.querySelector('[data-wall]');
wall.innerHTML = Array.from({ length: 16 }, (_, c) => {
  const imgs = Array.from({ length: 9 }, (_, r) => `<img src="${CDN(WALL[(c * 9 + r * 7) % WALL.length])}" alt="">`).join('');
  return `<div class="col" style="transform:translateY(${(c % 3) * 28 - (c % 2) * 40}px)">${imgs}</div>`;
}).join('');

/* Scale to the stage, or show the canvas alone with ?render */
const banner = document.querySelector('.banner');
if (new URLSearchParams(location.search).has('render')) {
  document.body.replaceChildren(banner);
  document.body.style.cssText = 'margin:0;padding:0;display:block;min-height:0;width:1280px;height:640px;overflow:hidden;background:#09090b';
} else {
  const stage = document.querySelector('.stage');
  new ResizeObserver(([e]) => banner.style.setProperty('--s', e.contentRect.width / 1280)).observe(stage);
}
</script>
</body>
</html>
